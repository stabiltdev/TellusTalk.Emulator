name: ci

on:
  pull_request:
  push:
    branches: [ 'main' ]
    tags: [ 'v*' ]

# A new push to a pull request cancels the run for the push before it. Each push to main and each tag runs to the end.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Stabilt.TellusTalk.Emulator.slnx

      - name: Build
        run: dotnet build Stabilt.TellusTalk.Emulator.slnx -c Release --no-restore

      - name: Format
        run: dotnet format Stabilt.TellusTalk.Emulator.slnx --verify-no-changes --no-restore

      # The Testcontainers package's tests start the emulator from this image, and are skipped without one.
      - name: Build the image for the tests
        run: dotnet publish src/Stabilt.TellusTalk.Emulator -c Release -r linux-x64 -t:PublishContainer -p:LocalRegistry=Docker -p:ContainerImageTag=test

      - name: Test
        env:
          TELLUSTALK_EMULATOR_TEST_IMAGE: stabiltdev/tellustalk-emulator:test
        run: dotnet test --solution Stabilt.TellusTalk.Emulator.slnx -c Release --no-build

  # A version tag publishes the image for linux-x64 and linux-arm64 under the version without its v. A release is also
  # tagged with its major and minor version and with latest; a pre-release is not, so latest never points at one.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tags travel as one quoted value, or MSBuild would read the semicolons between them as separate properties.
      - name: Publish the image
        run: |
          version="${GITHUB_REF_NAME#v}"
          tags="$version"
          if [[ "$version" != *-* ]]; then
            tags="$tags;${version%.*};latest"
          fi
          dotnet publish src/Stabilt.TellusTalk.Emulator -c Release -t:PublishContainer \
            -p:ContainerRegistry=ghcr.io \
            "-p:ContainerImageTags=\"$tags\""

  # The same tag publishes the Aspire and Testcontainers packages under the same version, each of which runs the image of
  # that version, so it waits for the image to be published.
  nuget:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Pack the Aspire package
        run: dotnet pack src/Stabilt.TellusTalk.Emulator.Aspire -c Release -o packages "-p:Version=${GITHUB_REF_NAME#v}"

      - name: Pack the Testcontainers package
        run: dotnet pack src/Stabilt.TellusTalk.Emulator.Testcontainers -c Release -o packages "-p:Version=${GITHUB_REF_NAME#v}"

      # nuget.org's Trusted Publishing policy names this repository and this file, ci.yml, so renaming the file stops the
      # publishing. The key it hands out lasts an hour, so it is asked for just before the push.
      - name: Log in to nuget.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push it to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
